# Benchmark: fused subtract-and-mask vs. naive add-of-complement-then-mask, mod 2^k.
#
# Full-width b-bit residue operands (k = b).  Since AzNat subtraction truncates
# at 0, the non-fused way to compute (a - c) mod 2^k is to add the precomputed
# additive inverse cb = 2^k - c and mask.
#
# Series:
#   Fused  = AzNat.subModPow2 a c k     (one borrow pass + mask)
#   Naive  = AzNat.modPow2 (a + cb) k   (full add, then a separate mask pass)

benchmark = "az_nat_sub_mod_pow2_residue"
limit     = 10000
title     = "az_nat_sub_mod_pow2_residue: fused borrow-and-mask vs add-of-complement (residues)"
x_label   = "Modulus bit-width k"

[params]
meanBitLength = 4096
iters         = 200
