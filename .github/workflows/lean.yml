name: Lean CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: No sorries
        run: |
          ! grep -rn "sorry" Azurite/ *.lean --include="*.lean"
      - name: No trailing whitespace
        run: |
          ! git grep -nE '[[:space:]]+$' -- '*.lean' '*.md' '*.tex' '*.yml' '*.yaml' '*.sh' '*.toml' '*.rs' '*.html' '*.scss'
      - name: Run tests
        run: lake test
      - name: Build benchmark executable
        run: lake build benchmark
      - name: Check axioms
        run: lake env lean scripts/check_axioms.lean
