name: Lean CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: No sorries
        run: |
          ! grep -rn "sorry" Azurite/ --include="*.lean"
      - name: Run tests
        run: lake test
      - name: Check axioms
        run: lake env lean scripts/check_axioms.lean
