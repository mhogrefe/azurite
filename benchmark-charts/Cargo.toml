[package]
name = "benchmark-charts"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "benchmark-charts"
path = "src/main.rs"

[dependencies]
malachite-q = "0.13.0"
malachite-nz = "0.13.0"
malachite-base = "0.13.0"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "full_palette"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
indicatif = "0.17"
